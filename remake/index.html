<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GATO</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #aaa; font-family: monospace; overflow: hidden; }
      #stage { position: relative; display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
      #screen { background: #000; outline: none; image-rendering: pixelated; }
      /* Scanline overlay (display mode "crt"): subtle dark lines on every other device row plus a soft vignette. */
      #crt {
        display: none; position: absolute; pointer-events: none;
        background:
          repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.22) 3px, rgba(0, 0, 0, 0.22) 4px),
          radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.35) 100%);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="screen" width="640" height="400" tabindex="0"></canvas>
      <div id="crt"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
